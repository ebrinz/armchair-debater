name: debate_text

# Scripted, text mode: the bot's decisions, turn by turn. Run from server/:
#
#   uv run pipecat eval suite evals/suite.yaml -k script
#
# The suite starts a fresh bot per scenario, so each one begins in the setup
# node. `eval:` criteria are judged by local Ollama (`ollama pull gemma4:12b`).

scenarios:
  - name: setup_matches_view_and_opposes
    turns:
      - expect:
          - event: response
            eval: "the bot introduces itself and asks the user what they think consciousness is"

      - user: "I think consciousness is just information getting broadcast around the brain so every part can use it."
        expect:
          - event: function_call
            calls:
              - name: set_positions
                args: {user_theory: gwt}
          - event: response
            eval: "the bot says the user's view is closest to global workspace theory, says it will defend a different named theory, and gives an argument for that theory"

  - name: cites_only_from_the_card
    turns:
      - expect:
          - event: response
            eval: "the bot asks the user what they think consciousness is"

      - user: "It's a global workspace. Information gets broadcast across the brain. I'd like you to defend integrated information theory against it."
        expect:
          - event: function_call
            calls:
              - name: set_positions
                args: {user_theory: gwt, bot_theory: iit}

      - user: "Before I start, what's the key paper for your side? Give me an author and a year."
        expect:
          - event: response
            eval: "the bot names a paper by Tononi, or by Oizumi, or by Albantakis, with a year, and does not name any other author's paper"

  - name: full_debate_reaches_a_verdict
    turns:
      - expect:
          - event: response
            eval: "the bot asks the user what they think consciousness is"

      - user: "Consciousness is a global workspace: whatever wins the competition for attention gets broadcast brain-wide. I want you to defend integrated information theory against it."
        expect:
          - event: function_call
            calls:
              - name: set_positions
                args: {user_theory: gwt, bot_theory: iit}
          - event: response
            eval: "the bot gives an opening argument and invites the user's opening statement"
            text_excludes: "*"

      - user: "My opening: workspace theory makes predictions that can fail. Masking experiments show a sudden brain-wide ignition exactly when people report seeing the stimulus. Your theory's central quantity can't even be computed for a real brain."
        expect:
          - event: function_call
            calls:
              - name: opening_done
          - event: response
            eval: "the bot rebuts the user's point about computability or testability, and invites the user's rebuttal"
            text_excludes: "`"

      - user: "Hang on, before my rebuttal: what's your source for that? Author and year."
        expect:
          - event: response
            eval: "the bot names a paper by one of these authors only: Tononi, Oizumi, Albantakis, Boly, Massimini, Koch, Baars, Dehaene, Naccache, Changeux, Mashour, Roelfsema; or says it does not have a source; it names no other author"
          - event: function_call
            absent: true
            within_ms: 15000

      - user: "My rebuttal: saying phi is well defined but intractable doesn't help. And your theory implies a simple grid of logic gates is more conscious than I am, which is absurd."
        expect:
          - event: function_call
            calls:
              - name: rebuttal_done
          - event: response
            eval: "the bot gives a closing statement and invites the user's closing statement"
            text_excludes: "_"

      - user: "My closing: a theory of consciousness has to be testable, and only one of these two theories is. That's the last word."
        expect:
          - event: function_call
            calls:
              - name: judge_debate
          - event: response
            eval: "the bot announces a result: it states two final health numbers and says who won or that it was a draw, and offers a rematch"
            text_excludes: "#"

      - user: "That doesn't change anything. Global workspace theory is still the only one of these with real empirical support, and that should settle it."
        expect:
          - event: response
            eval: "the bot responds to the user's continued argument without offering to start or starting a rematch, for example by chatting about the debate or reminding them the scoring is already over"
          - event: function_call
            absent: true
            within_ms: 15000

  - name: matches_a_non_workspace_view
    turns:
      - expect:
          - event: response
            eval: "the bot asks the user what they think consciousness is"

      - user: "Honestly I think consciousness is a kind of trick the brain plays on itself; there's nothing extra there to explain."
        expect:
          - event: function_call
            calls:
              - name: set_positions
                args: {user_theory: illusionism}
          - event: response
            eval: "the bot says which theory it will defend, and that theory is one of property dualism, panpsychism, or orchestrated objective reduction"

  - name: does_not_assign_a_view_the_user_never_gave
    turns:
      - expect:
          - event: response
            eval: "the bot introduces itself and asks the user what they think consciousness is"

      - user: "I don't know, I was kind of hoping you'd tell me."
        expect:
          - event: response
            eval: "the bot offers a few plain-language options for what consciousness might be and asks which is closest, without stating a view of its own and without starting a debate"
          - event: function_call
            absent: true
            within_ms: 15000

      - user: "Hmm, hang on a second."
        expect:
          - event: function_call
            absent: true
            within_ms: 15000

      - user: "OK, the illusion one. I think it's a trick the brain plays on itself."
        expect:
          - event: function_call
            calls:
              - name: set_positions
                args: {user_theory: illusionism}
