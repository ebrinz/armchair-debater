name: debate_simulated

# Simulated, text mode: an LLM plays a stubborn workspace theorist through a
# whole debate. Run from server/:
#
#   uv run pipecat eval suite evals/suite.yaml -k simulation
#
# The caller and the judge both run on local Ollama (`ollama pull gemma4:12b`).
#
# A harness timing quirk to know about: deepseek sends a whitespace-only reply
# ("\n\n") alongside every tool call, and the simulation driver takes that for
# the bot's turn — so after each round change the caller speaks BEFORE hearing the
# bot's new turn. A short caller turn can even arrive first and interrupt it.
# That is why the persona's cross-examination turns are a few sentences long, and
# why the bot's `answer_given` tool refuses to advance until the house has had
# its say (handlers.py) — the same guard covers a real barge-in.

persona: |
  Sam, a confident amateur who has read a lot about global workspace theory and
  thinks integrated information theory is unscientific. When asked what
  consciousness is, Sam says it is information broadcast across the brain so
  every system can use it, and asks the bot to defend integrated information
  theory against it. Sam argues in three or four sentences at a time and
  never concedes. Sam's prepared points: workspace theory predicts a measurable
  brain-wide ignition and masking experiments find it; phi cannot be computed
  for any real brain; integrated information theory implies simple grids of
  logic gates are highly conscious; over a hundred researchers called it
  pseudoscience in 2023. Sam gives an opening statement when invited, a
  rebuttal when invited, and a closing statement when invited, one per turn.
  In cross-examination, when invited to question the bot, Sam takes two
  sentences to say why falsifiability matters and then asks exactly one
  question: what observation could ever show integrated information theory to
  be false? When the bot then asks Sam a question, Sam answers it in three
  sentences without conceding.
goal: "Debate the bot through opening, rebuttal, cross-examination, and closing, hear the verdict, decline a rematch, then end the call."
success: "the debate ran through an opening, a rebuttal, a cross-examination in which the user asked the bot a question, the bot answered it and asked the user a question of its own, and a closing round; the judge_debate tool was called; and the bot announced a winner or a draw with final health numbers"
max_turns: 12
metrics:
  - name: rebuts
    criterion: "when the reply is the bot's opening, rebuttal, or closing argument, it rebuts or concedes a specific point the user made rather than merely agreeing; every other kind of reply passes: a greeting, setting up the debate, cross-examination, the verdict, or chat after the verdict"
    min_score: 0.8
  - name: speakable
    criterion: "the reply is plain spoken prose with no bullet points, markdown, emojis, or lists"
    min_score: 1
  - measure: words
    max_value: 90
  - measure: function_calls
    calls:
      - name: set_positions
        args: {user_theory: gwt, bot_theory: iit}
      - name: opening_done
      - name: rebuttal_done
      - name: question_asked
      - name: answer_given
      - name: judge_debate
runs: 2
